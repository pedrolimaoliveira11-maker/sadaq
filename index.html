<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📚 Biblioteca</title>

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #f4f6f9; }
    header { background: #2c3e50; color: #fff; padding: 12px 24px;
             display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 18px; margin: 0; }
    header button { background: #e74c3c; color: #fff; border: 0;

    .container { max-width: 1000px; margin: 20px auto; padding: 0 16px; }

    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    input, select, button {
      padding: 8px 10px; border: 1px solid #ccc;
      border-radius: 6px; font-size: 14px;
    }
    button { background: #3498db; color: #fff; border: 0; cursor: pointer; }
    button:hover { background: #2980b9; }
    button.danger { background: #e74c3c; }
    button.success { background: #27ae60; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #ecf0f1; }

    .tabs button { background: #bdc3c7; }
    .tabs button.active { background: #2c3e50; }
    .erro { color: #c0392b; font-size: 13px; margin-top: 6px; }
    .ok { color: #27ae60; font-size: 13px; margin-top: 6px; }

    .badge.atrasado { background: #fdecea; color: #c0392b; }
    .badge.ativo { background: #eafaf1; color: #27ae60; }
    .badge.devolvido { background: #ecf0f1; color: #7f8c8d; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;
const API = '/api';

/* ---------- utilitários ---------- */
function getToken() { return localStorage.getItem('token'); }

async function request(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  const t = getToken();
  if (t) headers.Authorization = `Bearer ${t}`;
  const r = await fetch(API + path, {
    method, headers, body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401) { localStorage.removeItem('token'); window.location.reload(); }
  const text = await r.text();
  const data = text ? JSON.parse(text) : null;
  if (!r.ok) throw new Error((data && data.erro) || 'Erro na requisição');
  return data;
}

const api = {
  get:  (p) => request('GET', p),
  post: (p, b) => request('POST', p, b),
  put:  (p, b) => request('PUT', p, b),
  del:  (p) => request('DELETE', p),
};

/* ---------- tela de login ---------- */
function Login({ onLogin }) {
  const [email, setEmail] = useState('admin@biblio.com');
  const [senha, setSenha] = useState('admin123');
  const [erro, setErro] = useState('');

  const submit = async (e) => {
    e.preventDefault();
    try {
      const { token } = await api.post('/auth/login', { email, senha });
      localStorage.setItem('token', token);
      onLogin();
    } catch (err) { setErro(err.message); }
  };

  return (
    <div style={{ maxWidth: 360, margin: '80px auto' }} className="card">
      <h2>📚 Login Biblioteca</h2>
      <form onSubmit={submit}>
        <div className="row">
          <input placeholder="Email" value={email}
            onChange={e => setEmail(e.target.value)} style={{ flex: 1 }} />
        </div>
        <div className="row">
          <input type="password" placeholder="Senha" value={senha}
            onChange={e => setSenha(e.target.value)} style={{ flex: 1 }} />
        </div>
        <button type="submit" style={{ width: '100%' }}>Entrar</button>
        {erro && <div className="erro">{erro}</div>}
        <div style={{ fontSize: 12, color: '#888', marginTop: 10 }}>
          Padrão: admin@biblio.com / admin123
        </div>
      </form>
    </div>
  );
}

/* ---------- aba: livros ---------- */
function AbaLivros() {
  const [livros, setLivros] = useState([]);
  const [busca, setBusca] = useState('');
  const [form, setForm] = useState({ titulo: '', autor: '', isbn: '', ano: '', categoria: '', quantidade_total: 1 });
  const [erro, setErro] = useState('');
  const [ok, setOk] = useState('');

  const carregar = useCallback(async () => {
    try {
      const q = busca ? `?q=${encodeURIComponent(busca)}` : '';
      setLivros(await api.get('/livros' + q));
    } catch (e) { setErro(e.message); }
  }, [busca]);

  useEffect(() => { carregar(); }, [carregar]);

  const salvar = async (e) => {
    e.preventDefault();
    setErro(''); setOk('');
    try {
      await api.post('/livros', { ...form, ano: form.ano ? Number(form.ano) : null });
      setForm({ titulo: '', autor: '', isbn: '', ano: '', categoria: '', quantidade_total: 1 });
      setOk('Livro cadastrado!');
      carregar();
    } catch (e) { setErro(e.message); }
  };

  const excluir = async (id) => {
    if (!confirm('Excluir livro?')) return;
    try { await api.del('/livros/' + id); carregar(); }
    catch (e) { setErro(e.message); }
  };

  return (
    <div>
      <div className="card">
        <h3>Novo Livro</h3>
        <form onSubmit={salvar}>
          <div className="row">
            <input placeholder="Título*" value={form.titulo} required
              onChange={e => setForm({ ...form, titulo: e.target.value })} />
            <input placeholder="Autor*" value={form.autor} required
              onChange={e => setForm({ ...form, autor: e.target.value })} />
            <input placeholder="ISBN" value={form.isbn}
              onChange={e => setForm({ ...form, isbn: e.target.value })} />
          </div>
          <div className="row">
            <input placeholder="Ano" type="number" value={form.ano}
              onChange={e => setForm({ ...form, ano: e.target.value })} />
            <input placeholder="Categoria" value={form.categoria}
              onChange={e => setForm({ ...form, categoria: e.target.value })} />
            <input type="number" min="1" value={form.quantidade_total}
              onChange={e => setForm({ ...form, quantidade_total: e.target.value })} />
            <button type="submit">Cadastrar</button>
          </div>
          {erro && <div className="erro">{erro}</div>}
          {ok && <div className="ok">{ok}</div>}
        </form>
      </div>

      <div className="card">
        <div className="row">
          <input placeholder="Buscar por título, autor ou ISBN..." value={busca}
            onChange={e => setBusca(e.target.value)} style={{ flex: 1 }} />
          <button onClick={carregar}>Buscar</button>
        </div>
        <table>
          <thead>
            <tr><th>ID</th><th>Título</th><th>Autor</th><th>ISBN</th><th>Disp./Total</th><th></th></tr>
          </thead>
          <tbody>
            {livros.map(l => (
              <tr key={l.id}>
                <td>{l.id}</td>
                <td>{l.titulo}</td>
                <td>{l.autor}</td>
                <td>{l.isbn || '—'}</td>
                <td>{l.disponiveis}/{l.total_exemplares}</td>
                <td><button className="danger" onClick={() => excluir(l.id)}>Excluir</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ---------- aba: usuários ---------- */
function AbaUsuarios() {
  const [usuarios, setUsuarios] = useState([]);
  const [form, setForm] = useState({ nome: '', email: '', cpf: '', telefone: '' });
  const [erro, setErro] = useState('');

  const carregar = useCallback(async () => {
    try { setUsuarios(await api.get('/usuarios')); }
    catch (e) { setErro(e.message); }
  }, []);

  useEffect(() => { carregar(); }, [carregar]);

  const salvar = async (e) => {
    e.preventDefault();
    setErro('');
    try {
      await api.post('/usuarios', form);
      setForm({ nome: '', email: '', cpf: '', telefone: '' });
      carregar();
    } catch (e) { setErro(e.message); }
  };

  const excluir = async (id) => {
    if (!confirm('Excluir usuário?')) return;
    try { await api.del('/usuarios/' + id); carregar(); }
    catch (e) { setErro(e.message); }
  };

  return (
    <div>
      <div className="card">
        <h3>Novo Usuário</h3>
        <form onSubmit={salvar}>
          <div className="row">
            <input placeholder="Nome*" value={form.nome} required
              onChange={e => setForm({ ...form, nome: e.target.value })} />
            <input placeholder="Email*" value={form.email} required
              onChange={e => setForm({ ...form, email: e.target.value })} />
          </div>
          <div className="row">
            <input placeholder="CPF*" value={form.cpf} required
              onChange={e => setForm({ ...form, cpf: e.target.value })} />
            <input placeholder="Telefone" value={form.telefone}
              onChange={e => setForm({ ...form, telefone: e.target.value })} />
            <button type="submit">Cadastrar</button>
          </div>
          {erro && <div className="erro">{erro}</div>}
        </form>
      </div>

      <div className="card">
        <table>
          <thead><tr><th>ID</th><th>Nome</th><th>Email</th><th>CPF</th><th>Telefone</th><th></th></tr></thead>
          <tbody>
            {usuarios.map(u => (
              <tr key={u.id}>
                <td>{u.id}</td>
                <td>{u.nome}</td>
                <td>{u.email}</td>
                <td>{u.cpf}</td>
                <td>{u.telefone || '—'}</td>
                <td><button className="danger" onClick={() => excluir(u.id)}>Excluir</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}
