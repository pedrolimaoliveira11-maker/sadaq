<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste de Humor</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#4e54c8,#8f94fb);
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    background:#fff;
    width:90%;
    max-width:700px;
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    color:#333;
}

#pergunta{
    font-size:22px;
    margin:20px 0;
    text-align:center;
}

button{
    width:100%;
    margin:8px 0;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#4e54c8;
    color:#fff;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#373cc2;
}

#resultado{
    display:none;
    text-align:center;
}

.pontuacao{
    font-size:30px;
    color:#4e54c8;
    font-weight:bold;
}

.alerta{
    margin-top:15px;
    color:#666;
}
</style>
</head>
<body>

<div class="container">

<h1>🌱 Check-in Emocional</h1>

<div id="quiz">
    <h2 id="pergunta"></h2>

    <button onclick="responder(0)">Nunca</button>
    <button onclick="responder(1)">Alguns dias</button>
    <button onclick="responder(2)">Frequentemente</button>
    <button onclick="responder(3)">Quase todos os dias</button>
</div>

<div id="resultado">
    <h2>Resultado</h2>

    <div class="pontuacao" id="total"></div>

    <h3 id="nivel"></h3>

    <p id="mensagem"></p>

    <p class="alerta">
        Este teste é apenas informativo e não substitui avaliação médica.
    </p>

    <button onclick="location.reload()">
        Refazer Teste
    </button>
</div>

</div>

<script>

const perguntas = [
"Você tem sentido pouca vontade de fazer atividades?",
"Você tem se sentido triste ou desanimado?",
"Você está dormindo mal?",
"Você sente pouca energia durante o dia?",
"Você tem dificuldade para se concentrar?",
"Você tem evitado contato com amigos ou familiares?",
"Você sente pouca esperança em relação ao futuro?",
"Você se sente sozinho com frequência?"
];

let atual = 0;
let pontos = 0;

function carregarPergunta(){

    document.getElementById("pergunta").innerText =
    perguntas[atual];
}

function responder(valor){

    pontos += valor;
    atual++;

    if(atual < perguntas.length){
        carregarPergunta();
    }else{
        mostrarResultado();
    }
}

function mostrarResultado(){

    document.getElementById("quiz").style.display = "none";
    document.getElementById("resultado").style.display = "block";

    let nivel = "";
    let mensagem = "";

    if(pontos <= 5){
        nivel = "😊 Bem-estar Positivo";
        mensagem =
        "Seu resultado mostra poucos sinais de sofrimento emocional.";
    }

    else if(pontos <= 10){
        nivel = "🌿 Atenção";
        mensagem =
        "Você apresentou alguns sinais de estresse emocional.";
    }

    else if(pontos <= 16){
        nivel = "💛 Moderado";
        mensagem =
        "Seu resultado indica sinais importantes de sofrimento emocional. Conversar com um psicólogo pode ajudar.";
    }

    else{
        nivel = "❤️ Elevado";
        mensagem =
        "Você relatou muitos sintomas emocionais. Considere procurar apoio profissional para uma avaliação adequada.";
    }

    document.getElementById("total").innerText =
    pontos + " pontos";

    document.getElementById("nivel").innerText =
    nivel;

    document.getElementById("mensagem").innerText =
    mensagem;
}

carregarPergunta();

</script>

</body>
</html>
