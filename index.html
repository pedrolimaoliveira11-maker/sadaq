<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo Calmamente</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#4facfe,#00f2fe);
    text-align:center;
    color:white;
    margin:0;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:rgba(0,0,0,0.25);
    padding:20px;
    border-radius:20px;
}

button{
    padding:12px 20px;
    margin:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    background:#fff;
    color:#333;
}

#respirar{
    width:120px;
    height:120px;
    background:white;
    border-radius:50%;
    margin:20px auto;
    transition:all 4s linear;
}

input{
    padding:10px;
    width:80%;
    border:none;
    border-radius:10px;
    font-size:16px;
}

#chat{
    min-height:120px;
    padding:10px;
    background:rgba(255,255,255,0.15);
    border-radius:10px;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="container">
<h1>🌱 Calmamente</h1>
<p>Um pequeno jogo para ajudar a relaxar.</p>

<h2>💨 Exercício de Respiração</h2>

<div id="respirar"></div>

<button onclick="iniciarRespiracao()">Começar Respiração</button>

<h2>⭐ Missões Positivas</h2>

<p id="missao">Clique para receber uma missão.</p>

<button onclick="novaMissao()">Nova Missão</button>

<h2>🤖 Conversa de Apoio</h2>

<input id="mensagem" placeholder="Como você está se sentindo?" />

<button onclick="responder()">Enviar</button>

<div id="chat"></div>

</div>

<script>
function iniciarRespiracao(){
    let bola = document.getElementById("respirar");

    bola.style.transform = "scale(1.8)";

    setTimeout(()=>{
        bola.style.transform = "scale(1)";
    },4000);

    alert("Inspire por 4 segundos e expire por 4 segundos.");
}

const missoes = [
"🌞 Abra a janela e observe o céu por 2 minutos.",
"💧 Beba um copo de água.",
"🚶 Caminhe pela casa durante 3 minutos.",
"😊 Pense em algo bom que aconteceu nesta semana.",
"🎵 Ouça sua música favorita.",
"💚 Escreva 3 coisas pelas quais você é grato."
];

function novaMissao(){
    let sorteio = Math.floor(Math.random()*missoes.length);
    document.getElementById("missao").innerText = missoes[sorteio];
}

function responder(){
    let msg = document.getElementById("mensagem").value.toLowerCase();
    let resposta = "";

    if(msg.includes("triste")){
        resposta = "💚 Sinto muito que esteja se sentindo triste. Você já superou momentos difíceis antes.";
    }
    else if(msg.includes("ansioso") || msg.includes("ansiedade")){
        resposta = "🌿 Vamos respirar juntos. Inspire lentamente e solte o ar devagar.";
    }
    else if(msg.includes("cansado")){
        resposta = "☁️ Seu descanso é importante. Tente fazer uma pausa e cuidar de você.";
    }
    else if(msg.includes("feliz")){
        resposta = "🌟 Que bom! Aproveite esse momento e compartilhe essa energia positiva.";
    }
    else{
        resposta = "🤗 Obrigado por compartilhar. Você merece cuidado e gentileza consigo mesmo.";
    }

    document.getElementById("chat").innerHTML =
        "<b>Você:</b> " + msg +
        "<br><br><b>Calmamente:</b> " + resposta;
}
</script>

</body>
</html>
